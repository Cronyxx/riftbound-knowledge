<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">Your side of the table before the first turn</title>
  <desc id="desc">Two battlefields sit above your mat. Your Rune Deck is on the left. Your face-up Champion Legend and Chosen Champion sit on the right above the empty Trash and face-down Main Deck. The base and rune area are empty.</desc>
  <rect width="600" height="430" rx="20" fill="#f3f1e9"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#183f3a">
    <text x="300" y="38" font-size="24" font-weight="700">Shared battlefield area</text>
    <g fill="#dcece1" stroke="#246b61" stroke-width="2">
      <rect x="70" y="53" width="218" height="92" rx="10"/>
      <rect x="312" y="53" width="218" height="92" rx="10"/>
    </g>
    <text x="179" y="107" font-size="20" font-weight="700">Your battlefield</text>
    <text x="421" y="107" font-size="20" font-weight="700">Opponent’s battlefield</text>
    <rect x="20" y="164" width="560" height="246" rx="10" fill="#e8e9dd" stroke="#9aafa5" stroke-width="2"/>
    <g fill="#fcfbf7" stroke="#9aafa5" stroke-dasharray="5 4">
      <rect x="43" y="184" width="292" height="110" rx="8"/>
      <rect x="145" y="307" width="190" height="67" rx="8"/>
      <rect x="368" y="307" width="64" height="67" rx="8"/>
    </g>
    <text x="189" y="245" font-size="23" font-weight="700">Base</text>
    <text x="240" y="347" font-size="19">Runes</text>
    <g stroke="#527970" stroke-width="2">
      <rect x="368" y="184" width="64" height="78" rx="7" fill="#efe4d0"/>
      <rect x="479" y="184" width="64" height="78" rx="7" fill="#b8d8c8"/>
      <rect x="45" y="303" width="64" height="72" rx="7" fill="#c4d0e3"/>
      <rect x="49" y="307" width="64" height="72" rx="7" fill="#dde5f5"/>
      <rect x="475" y="303" width="64" height="72" rx="7" fill="#b9cdc2"/>
      <rect x="479" y="307" width="64" height="72" rx="7" fill="#d5dedb"/>
    </g>
    <text x="400" y="231" font-size="15">Legend</text>
    <text x="511" y="231" font-size="15">Unit</text>
    <text x="400" y="282" font-size="13" font-weight="700">Champion Legend</text>
    <text x="511" y="282" font-size="13" font-weight="700">Chosen Champion</text>
    <text x="81" y="398" font-size="16" font-weight="700">Rune Deck</text>
    <text x="400" y="398" font-size="16" font-weight="700">Trash</text>
    <text x="511" y="398" font-size="16" font-weight="700">Main Deck</text>
  </g>
</svg>
